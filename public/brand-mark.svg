<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">EarlyCove</title>
  <desc id="desc">A radar cove with a rising signal</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17242a" />
      <stop offset="0.48" stop-color="#0d151c" />
      <stop offset="1" stop-color="#080b10" />
    </linearGradient>
    <linearGradient id="lime-signal" x1="12" y1="44" x2="53" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7f34a" />
      <stop offset="1" stop-color="#e9ff9b" />
    </linearGradient>
    <linearGradient id="cyan-data" x1="12" y1="47" x2="49" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ee7e7" />
      <stop offset="1" stop-color="#b4fff0" />
    </linearGradient>
    <radialGradient id="signal-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(38 28) rotate(115) scale(27)">
      <stop stop-color="#b7f34a" stop-opacity=".22" />
      <stop offset="1" stop-color="#b7f34a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#surface)" stroke="#23343a" stroke-width="2" />
  <circle cx="38" cy="28" r="27" fill="url(#signal-glow)" />

  <!-- The open radar rings give the mark its cove shape. -->
  <path d="M47.8 17.4A22.1 22.1 0 0 0 12 26.1M12 37.8A22.1 22.1 0 0 0 47.8 46.6" fill="none" stroke="url(#cyan-data)" stroke-width="2.4" stroke-linecap="round" opacity=".74" />
  <path d="M42.5 22.4A15.6 15.6 0 0 0 18.2 28M18.2 36A15.6 15.6 0 0 0 42.5 41.6" fill="none" stroke="#5ee7e7" stroke-width="1.15" stroke-linecap="round" opacity=".33" />

  <!-- A rising pulse cuts through the cove and ends at a signal node. -->
  <path d="M12.8 42.2h8.1l5.9-11 5.2 7.4 6.2-14.8 11.1 5.4" fill="none" stroke="url(#lime-signal)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M13.5 49c5.6-1.1 9.4-4.2 14.7-4.2 5.8 0 9.2 4.3 19.2.1" fill="none" stroke="url(#cyan-data)" stroke-width="2.5" stroke-linecap="round" opacity=".9" />
  <circle cx="49.2" cy="28.9" r="3.25" fill="#f4f7f2" />
  <circle cx="49.2" cy="28.9" r="5.9" fill="none" stroke="#b7f34a" stroke-width="1" opacity=".36" />
  <circle cx="13.1" cy="42.2" r="1.6" fill="#b7f34a" />
</svg>
